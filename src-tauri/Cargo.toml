[package]
name = "careeros"
version = "1.0.0"
description = "CareerOS — local-first career management"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
